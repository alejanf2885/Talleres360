/* ── BUTTON ───────────────────────────────────────────── */
const Btn=({children,variant='primary',size='md',icon,onClick,style:sx,disabled})=>{
  const [h,sh]=useState(false);
  const sz={sm:{padding:'6px 12px',fontSize:13},md:{padding:'9px 18px',fontSize:14},lg:{padding:'12px 24px',fontSize:15}};
  const v={
    primary:  {bg:h?'var(--c-accent-hover)':'var(--c-accent)',color:'#fff',border:'none'},
    secondary:{bg:h?'var(--c-border)':'var(--c-surface)',color:'var(--c-text)',border:'1px solid var(--c-border)'},
    ghost:    {bg:h?'rgba(0,0,0,0.04)':'transparent',color:'var(--c-text-secondary)',border:'none'},
    danger:   {bg:h?'oklch(0.52 0.22 25)':'var(--c-red)',color:'#fff',border:'none'},
    success:  {bg:h?'oklch(0.58 0.18 150)':'var(--c-green)',color:'#fff',border:'none'},
    outline:  {bg:'transparent',color:'var(--c-accent)',border:'1.5px solid var(--c-accent)'},
  }[variant];
  return <button onClick={onClick} disabled={disabled} onMouseEnter={()=>sh(true)} onMouseLeave={()=>sh(false)}
    style={{display:'inline-flex',alignItems:'center',gap:6,cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.5:1,fontFamily:'var(--font-body)',fontWeight:600,borderRadius:'var(--r-md)',transition:'all var(--transition)',...sz[size],...v,...(sx||{})}}>{icon&&<I n={icon} s={14}/>}{children}</button>;
};

const AVATARCOLORS=['#3B5998','#E2703A','#2E8B57','#7B68EE','#CD5C5C','#4682B4','#9370DB','#20B2AA'];
const Avatar=({name,size=32})=>{
  const initials=name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const color=AVATARCOLORS[name.charCodeAt(0)%AVATARCOLORS.length];
  return <div style={{width:size,height:size,borderRadius:'50%',background:color,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-display)',fontWeight:700,fontSize:size*0.35,color:'#fff',flexShrink:0}}>{initials}</div>;
};

/* ── PLATE ────────────────────────────────────────────── */
const Plate=({value})=><code style={{background:'var(--c-bg)',padding:'3px 8px',borderRadius:'var(--r-sm)',fontSize:12,fontWeight:700,letterSpacing:'0.05em',color:'var(--c-text)',border:'1px solid var(--c-border)',fontFamily:'monospace'}}>{value}</code>;

/* ── CARD ─────────────────────────────────────────────── */
const Card=({children,style:s,onClick})=><div onClick={onClick} style={{background:'var(--c-surface)',borderRadius:'var(--r-lg)',border:'1px solid var(--c-border)',boxShadow:'var(--shadow-xs)',padding:'var(--sp-6)',...(s||{}),cursor:onClick?'pointer':undefined}}>{children}</div>;

/* ── STAT CARD ────────────────────────────────────────── */
const StatCard=({label,value,delta,icon,accentBg,accentColor})=>(
  <Card>
    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:12}}>
      <span style={{fontSize:11,fontWeight:700,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.07em'}}>{label}</span>
      <span style={{width:34,height:34,borderRadius:'var(--r-md)',background:accentBg||'var(--c-accent-soft)',display:'flex',alignItems:'center',justifyContent:'center',color:accentColor||'var(--c-accent)'}}><I n={icon} s={15}/></span>
    </div>
    <div style={{fontFamily:'var(--font-display)',fontSize:26,fontWeight:700,color:'var(--c-text)',letterSpacing:'-0.02em',lineHeight:1}}>{value}</div>
    {delta&&<div style={{marginTop:8,fontSize:12,color:delta.startsWith('+')?'var(--c-green)':'var(--c-red)',fontWeight:600}}>{delta} <span style={{color:'var(--c-text-muted)',fontWeight:400}}>vs mes anterior</span></div>}
  </Card>
);

/* ── PAGE HEADER ──────────────────────────────────────── */
const PageHeader=({title,subtitle,action,actionIcon,actionLabel})=>(
  <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:20}}>
    <div>
      <h1 style={{fontFamily:'var(--font-display)',fontSize:21,fontWeight:700,color:'var(--c-text)',letterSpacing:'-0.02em'}}>{title}</h1>
      {subtitle&&<p style={{fontSize:13,color:'var(--c-text-secondary)',marginTop:2}}>{subtitle}</p>}
    </div>
    {actionLabel&&<Btn icon={actionIcon||'plus'} variant="primary" onClick={action}>{actionLabel}</Btn>}
  </div>
);

/* ── SEARCH BAR ───────────────────────────────────────── */
const SearchBar=({placeholder,value,onChange})=>{
  const [f,sf]=useState(false);
  return <div style={{position:'relative',flex:1,maxWidth:340}}>
    <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'var(--c-text-muted)'}}><I n="search" s={14}/></span>
    <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      onFocus={()=>sf(true)} onBlur={()=>sf(false)}
      style={{width:'100%',padding:'8px 12px 8px 34px',border:`1.5px solid ${f?'var(--c-accent)':'var(--c-border)'}`,borderRadius:'var(--r-md)',background:'var(--c-surface)',fontFamily:'var(--font-body)',fontSize:13,color:'var(--c-text)',outline:'none',transition:'border var(--transition)',boxShadow:f?'0 0 0 3px oklch(0.60 0.18 245 / 0.12)':'none'}}/>
  </div>;
};

/* ── FILTER CHIP ──────────────────────────────────────── */
const Chip=({label,active,onClick,dot})=>(
  <button onClick={onClick} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:'var(--r-full)',border:`1.5px solid ${active?'var(--c-accent)':'var(--c-border)'}`,background:active?'var(--c-accent-soft)':'var(--c-surface)',color:active?'var(--c-accent)':'var(--c-text-secondary)',fontSize:12,fontWeight:active?700:500,cursor:'pointer',transition:'all var(--transition)',whiteSpace:'nowrap'}}>
    {dot&&<span style={{width:6,height:6,borderRadius:'50%',background:dot,flexShrink:0}}/>}
    {label}
  </button>
);

/* ── DETAIL PANEL (slide-in) ──────────────────────────── */
const Panel=({open,onClose,children,width=420})=>(
  <>
    {open&&<div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(15,20,32,0.35)',zIndex:200,backdropFilter:'blur(2px)'}}/>}
    <div style={{position:'fixed',top:0,right:0,bottom:0,width,background:'var(--c-surface)',zIndex:201,boxShadow:'-8px 0 40px rgba(15,20,32,0.18)',transform:open?'translateX(0)':'translateX(100%)',transition:'transform 280ms cubic-bezier(0.4,0,0.2,1)',display:'flex',flexDirection:'column',overflowY:'auto'}}>
      {children}
    </div>
  </>
);

/* ═══════════════════════════════════════════════════════
   CLIENTES VIEW
═══════════════════════════════════════════════════════ */

          <div style={{display:'flex',gap:6,marginLeft:4}}>
            {[['todos','Todos'],['activo','Activos'],['inactivo','Inactivos']].map(([v,l])=>(
              <Chip key={v} label={l} active={filter===v} onClick={()=>setFilter(v)}/>
            ))}
          </div>
          <div style={{marginLeft:'auto',display:'flex',gap:8}}>
            <Btn variant="secondary" size="sm" icon="download">Exportar</Btn>

        {/* Table */}
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead>
              <tr style={{borderBottom:'1px solid var(--c-border)'}}>

              </tr>
            </thead>
            <tbody>
              {filtered.map(c=>(
                <tr key={c.id} onClick={()=>{setSelected(c.id);setTab('datos');}}
                  style={{borderBottom:'1px solid var(--c-border)',cursor:'pointer',transition:'background var(--transition)',background:selected===c.id?'var(--c-accent-soft)':'transparent'}}
                  onMouseEnter={e=>{if(selected!==c.id)e.currentTarget.style.background='var(--c-bg)'}}

                        <div style={{fontSize:11,color:'var(--c-text-muted)',marginTop:1}}>{c.email}</div>
                      </div>

                  <td style={{padding:'13px 16px',color:'var(--c-text-secondary)'}}>{c.tel}</td>
                  <td style={{padding:'13px 16px'}}>
                    <span style={{display:'inline-flex',alignItems:'center',gap:5,background:'var(--c-bg)',padding:'2px 8px',borderRadius:'var(--r-full)',fontSize:12,fontWeight:600,color:'var(--c-text)'}}><I n="car" s={12} c="var(--c-text-muted)"/>{c.vehiculos}</span>
                  </td>
                  <td style={{padding:'13px 16px',color:'var(--c-text-secondary)',fontSize:12}}>{c.ultimaVisita}</td>
                  <td style={{padding:'13px 16px',fontFamily:'var(--font-display)',fontWeight:700,color:'var(--c-text)'}}>{c.totalGastado}</td>
                  <td style={{padding:'13px 16px'}}>
                    <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:'var(--r-full)',fontSize:11,fontWeight:700,background:c.activo?'var(--c-green-soft)':'var(--c-bg)',color:c.activo?'var(--c-green)':'var(--c-text-muted)'}}>

                  </td>
                  <td style={{padding:'13px 16px'}}><button style={{background:'none',border:'none',cursor:'pointer',color:'var(--c-text-muted)',padding:'2px 4px'}}><I n="chevronRight" s={14}/></button></td>
                </tr>
              ))}
            </tbody>
          </table>
          {filtered.length===0&&<div style={{padding:'48px',textAlign:'center',color:'var(--c-text-muted)',fontSize:14}}>No se encontraron clientes con ese criterio</div>}
        </div>

        {/* Footer */}
        <div style={{padding:'10px 18px',borderTop:'1px solid var(--c-border)',fontSize:12,color:'var(--c-text-muted)'}}>Mostrando {filtered.length} de {CLIENTES.length} clientes</div>
      </Card>

      {/* Detail panel */}
      <Panel open={!!selected} onClose={()=>setSelected(null)}>
        {cliente&&<>
          {/* Panel header */}
          <div style={{padding:'24px 24px 0',background:'var(--c-primary)',color:'#fff',flexShrink:0}}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:16}}>
              <button onClick={()=>setSelected(null)} style={{background:'rgba(255,255,255,0.12)',border:'none',borderRadius:'var(--r-md)',width:30,height:30,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'#fff'}}><I n="x" s={14}/></button>
              <Btn variant="outline" size="sm" icon="edit" style={{borderColor:'rgba(255,255,255,0.3)',color:'#fff'}}>Editar</Btn>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:14,paddingBottom:20}}>
              <Avatar name={cliente.nombre} size={52}/>
              <div>
                <div style={{fontFamily:'var(--font-display)',fontSize:18,fontWeight:700}}>{cliente.nombre}</div>
                <div style={{fontSize:12,color:'rgba(255,255,255,0.6)',marginTop:2}}>{cliente.email}</div>
                <div style={{marginTop:8}}>
                  <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:'var(--r-full)',fontSize:11,fontWeight:700,background:cliente.activo?'rgba(52,211,153,0.25)':'rgba(255,255,255,0.1)',color:cliente.activo?'#6ee7b7':'rgba(255,255,255,0.6)'}}>
                    <span style={{width:5,height:5,borderRadius:'50%',background:cliente.activo?'#6ee7b7':'rgba(255,255,255,0.4)'}}/>
                    {cliente.activo?'Activo':'Inactivo'}
                  </span>
                </div>
              </div>
            </div>
            {/* Tabs */}
            <div style={{display:'flex',gap:0,marginTop:4}}>
              {[['datos','Datos'],['vehiculos','Vehículos'],['historial','Historial']].map(([id,lbl])=>(
                <button key={id} onClick={()=>setTab(id)} style={{padding:'8px 16px',border:'none',background:'none',cursor:'pointer',fontSize:13,fontWeight:tab===id?700:400,color:tab===id?'#fff':'rgba(255,255,255,0.5)',borderBottom:tab===id?'2px solid var(--c-accent)':'2px solid transparent',transition:'all var(--transition)'}}>

                  <div key={l} style={{background:'var(--c-bg)',borderRadius:'var(--r-md)',padding:'12px',textAlign:'center'}}>
                    <I n={ic} s={16} c="var(--c-accent)"/><div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:16,color:'var(--c-text)',marginTop:4}}>{v}</div>
                    <div style={{fontSize:10,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.06em',marginTop:2}}>{l}</div>
                  </div>
                ))}
              </div>
              <div style={{height:1,background:'var(--c-border)'}}/>
              {/* Contact info */}
              {[['phone',cliente.tel,'Teléfono'],['mail',cliente.email,'Email'],['calendar',cliente.ultimaVisita,'Última visita']].map(([ic,val,lbl])=>(

                  <div><div style={{fontSize:11,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:700}}>{lbl}</div><div style={{fontSize:14,color:'var(--c-text)',marginTop:1}}>{val}</div></div>

              ))}

            {tab==='vehiculos'&&<div style={{display:'flex',flexDirection:'column',gap:10}}>

                <div key={v.id} style={{padding:14,borderRadius:'var(--r-md)',border:'1px solid var(--c-border)',background:'var(--c-bg)'}}>

            </div>}

            {tab==='historial'&&<div style={{display:'flex',flexDirection:'column',gap:8}}>
              {clienteOrdenes.length===0&&<p style={{color:'var(--c-text-muted)',fontSize:14}}>Sin historial de órdenes</p>}

                  </div>

          </div>
        </>}
      </Panel>
    </div>

};

/* ═══════════════════════════════════════════════════════
   VEHÍCULOS VIEW
═══════════════════════════════════════════════════════ */
const VehiculosView=()=>{
  const [search,setSearch]=useState('');
  const [itvFilter,setItvFilter]=useState('todos');
  const [selected,setSelected]=useState(null);

  const caducadas=VEHICULOS.filter(v=>v.itvSt==='caducada');
  const proximas=VEHICULOS.filter(v=>v.itvSt==='pronto');

  const filtered=VEHICULOS.filter(v=>{
    const q=search.toLowerCase();
    const match=!q||v.matricula.toLowerCase().includes(q)||v.marca.toLowerCase().includes(q)||v.modelo.toLowerCase().includes(q)||v.propietario.toLowerCase().includes(q);
    const f=itvFilter==='todos'||v.itvSt===itvFilter;
    return match&&f;
  });

  const vehiculo=VEHICULOS.find(v=>v.id===selected);

  const itvCfg={caducada:{bg:'var(--c-red-soft)',color:'var(--c-red)',icon:'alert',label:'Caducada'},pronto:{bg:'var(--c-yellow-soft)',color:'var(--c-yellow-text)',icon:'warn',label:'Próxima'},ok:{bg:'var(--c-green-soft)',color:'var(--c-green)',icon:'check',label:'Vigente'}};

  return (
    <div className="page-enter">
      <PageHeader title="Vehículos" subtitle={`${VEHICULOS.length} vehículos registrados`} actionLabel="Nuevo vehículo"/>

      {/* ITV Alert banner */}
      {caducadas.length>0&&<div style={{marginBottom:14,padding:'12px 16px',borderRadius:'var(--r-md)',background:'var(--c-red-soft)',border:'1px solid var(--c-red)',display:'flex',alignItems:'center',gap:10,color:'var(--c-red)'}}>
        <I n="alert" s={16}/><span style={{fontSize:13,fontWeight:600}}>{caducadas.length} vehículo{caducadas.length>1?'s':''} con ITV caducada: {caducadas.map(v=>v.matricula).join(', ')}</span>

      </div>}

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:20}}>
        <StatCard label="Total vehículos" value={VEHICULOS.length} icon="vehicles" accentBg="var(--c-accent-soft)" accentColor="var(--c-accent)"/>

        <StatCard label="ITV próxima" value={proximas.length} icon="warn" accentBg="var(--c-yellow-soft)" accentColor="var(--c-yellow-text)"/>
        <StatCard label="ITV caducada" value={caducadas.length} icon="alert" accentBg="var(--c-red-soft)" accentColor="var(--c-red)"/>
      </div>

      <Card style={{padding:0}}>
        {/* Toolbar */}
        <div style={{padding:'14px 18px',borderBottom:'1px solid var(--c-border)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <SearchBar placeholder="Buscar matrícula, marca o propietario…" value={search} onChange={setSearch}/>
          <div style={{display:'flex',gap:6,marginLeft:4}}>
            {[['todos','Todos'],['ok','ITV Vigente','var(--c-green)'],['pronto','ITV Próxima','var(--c-yellow)'],['caducada','ITV Caducada','var(--c-red)']].map(([v,l,dot])=>(
              <Chip key={v} label={l} active={itvFilter===v} onClick={()=>setItvFilter(v)} dot={dot}/>
            ))}
          </div>
          <Btn variant="secondary" size="sm" icon="download" style={{marginLeft:'auto'}}>Exportar</Btn>
        </div>

        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead>
              <tr style={{borderBottom:'1px solid var(--c-border)'}}>
                {['Matrícula','Vehículo','Propietario','Km actuales','Último servicio','ITV',''].map(c=>(
                  <th key={c} style={{padding:'10px 16px',textAlign:'left',fontSize:11,fontWeight:700,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.07em',whiteSpace:'nowrap'}}>{c}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map(v=>{
                const itv=itvCfg[v.itvSt];
                return <tr key={v.id} onClick={()=>setSelected(selected===v.id?null:v.id)}
                  style={{borderBottom:'1px solid var(--c-border)',cursor:'pointer',transition:'background var(--transition)',background:selected===v.id?'var(--c-accent-soft)':'transparent'}}
                  onMouseEnter={e=>{if(selected!==v.id)e.currentTarget.style.background='var(--c-bg)'}}
                  onMouseLeave={e=>{if(selected!==v.id)e.currentTarget.style.background='transparent'}}>

                  <td style={{padding:'13px 16px'}}>
                    <div style={{fontWeight:600,color:'var(--c-text)'}}>{v.marca} {v.modelo}</div>
                    <div style={{fontSize:11,color:'var(--c-text-muted)',marginTop:1}}>{v.anio}</div>
                  </td>
                  <td style={{padding:'13px 16px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <Avatar name={v.propietario} size={26}/>
                      <span style={{fontSize:13,color:'var(--c-text)'}}>{v.propietario}</span>
                    </div>
                  </td>
                  <td style={{padding:'13px 16px',fontFamily:'var(--font-display)',fontWeight:600,color:'var(--c-text)'}}>{v.km} km</td>
                  <td style={{padding:'13px 16px',color:'var(--c-text-secondary)',maxWidth:180}}>{v.servicio}</td>
                  <td style={{padding:'13px 16px'}}>
                    <div style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 10px',borderRadius:'var(--r-full)',background:itv.bg,color:itv.color,fontSize:11,fontWeight:700}}>
                      <I n={itv.icon} s={11} c={itv.color}/>{v.itv}

          </table>

      </Card>

      {/* Vehicle detail panel */}
      <Panel open={!!selected} onClose={()=>setSelected(null)} width={380}>
        {vehiculo&&<>
          <div style={{padding:'20px 20px 0',background:'var(--c-primary)',flexShrink:0}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <button onClick={()=>setSelected(null)} style={{background:'rgba(255,255,255,0.12)',border:'none',borderRadius:'var(--r-md)',width:30,height:30,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'#fff'}}><I n="x" s={14}/></button>
              <Btn variant="outline" size="sm" icon="edit" style={{borderColor:'rgba(255,255,255,0.3)',color:'#fff'}}>Editar</Btn>
            </div>
            <div style={{marginBottom:16}}>
              <code style={{fontSize:20,fontWeight:800,color:'#fff',letterSpacing:'0.06em',fontFamily:'monospace',background:'rgba(255,255,255,0.12)',padding:'6px 14px',borderRadius:'var(--r-md)'}}>{vehiculo.matricula}</code>
              <div style={{fontFamily:'var(--font-display)',fontSize:17,fontWeight:700,color:'#fff',marginTop:12}}>{vehiculo.marca} {vehiculo.modelo}</div>
              <div style={{fontSize:13,color:'rgba(255,255,255,0.55)',marginTop:2}}>Año {vehiculo.anio}</div>
            </div>
            <div style={{paddingBottom:16,display:'flex',gap:16}}>
              {[['km actuales',vehiculo.km+' km'],['propietario',vehiculo.propietario]].map(([l,v])=>(
                <div key={l}><div style={{fontSize:10,color:'rgba(255,255,255,0.4)',textTransform:'uppercase',letterSpacing:'0.07em',fontWeight:700}}>{l}</div><div style={{fontSize:13,color:'#fff',marginTop:2,fontWeight:500}}>{v}</div></div>
              ))}
            </div>
          </div>
          <div style={{padding:20,display:'flex',flexDirection:'column',gap:14}}>
            {/* ITV status */}
            <div style={{padding:14,borderRadius:'var(--r-md)',background:itvCfg[vehiculo.itvSt].bg,border:`1px solid ${itvCfg[vehiculo.itvSt].color}22`}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                <I n={itvCfg[vehiculo.itvSt].icon} s={15} c={itvCfg[vehiculo.itvSt].color}/>
                <span style={{fontSize:12,fontWeight:700,color:itvCfg[vehiculo.itvSt].color,textTransform:'uppercase',letterSpacing:'0.06em'}}>ITV {itvCfg[vehiculo.itvSt].label}</span>
              </div>
              <div style={{fontSize:14,fontWeight:600,color:'var(--c-text)'}}>Vence: {vehiculo.itv}</div>
            </div>
            {/* Last service */}
            <div style={{padding:14,borderRadius:'var(--r-md)',background:'var(--c-bg)',border:'1px solid var(--c-border)'}}>
              <div style={{fontSize:11,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.07em',fontWeight:700,marginBottom:6}}>Último servicio</div>
              <div style={{fontSize:14,color:'var(--c-text)',fontWeight:500}}>{vehiculo.servicio}</div>
            </div>
            {/* Órdenes this vehicle */}
            <div>
              <div style={{fontSize:11,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.07em',fontWeight:700,marginBottom:10}}>Historial de órdenes</div>
              {ORDENES.filter(o=>o.matricula===vehiculo.matricula).map(o=>(
                <div key={o.id} style={{padding:'10px 12px',borderRadius:'var(--r-md)',border:'1px solid var(--c-border)',background:'var(--c-bg)',marginBottom:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:12,color:'var(--c-accent)'}}>{o.id}</span><Badge status={o.estado}/></div>
                  <div style={{fontSize:12,color:'var(--c-text-secondary)'}}>{o.descripcion}</div>
                  <div style={{fontSize:11,color:'var(--c-text-muted)',marginTop:4}}>{o.fecha} · {o.importe}</div>
                </div>
              ))}
              {ORDENES.filter(o=>o.matricula===vehiculo.matricula).length===0&&<p style={{fontSize:13,color:'var(--c-text-muted)'}}>Sin órdenes registradas</p>}
            </div>
          </div>
        </>}
      </Panel>
    </div>
  );
};

const KANBAN_COLS=[

  {id:'en_curso',   label:'En Curso',    color:'var(--c-accent)',  bg:'var(--c-accent-soft)'},

  {id:'entregado',  label:'Entregado',   color:'var(--c-text-muted)',bg:'#F0F1F5'},
];

const KanbanCard=({orden,onClick})=>(
  <div onClick={onClick} style={{background:'var(--c-surface)',borderRadius:'var(--r-md)',border:'1px solid var(--c-border)',padding:14,cursor:'pointer',transition:'all var(--transition)',marginBottom:8,boxShadow:'var(--shadow-xs)'}}

      <span style={{fontSize:10,color:'var(--c-text-muted)'}}>{orden.fecha}</span>
    </div>
    <div style={{fontWeight:600,color:'var(--c-text)',fontSize:13,marginBottom:3,lineHeight:1.3}}>{orden.cliente}</div>
    <div style={{marginBottom:8}}><Plate value={orden.matricula}/><span style={{fontSize:11,color:'var(--c-text-secondary)',marginLeft:6}}>{orden.vehiculo.split(' ').slice(0,2).join(' ')}</span></div>
    <div style={{fontSize:12,color:'var(--c-text-secondary)',marginBottom:10,lineHeight:1.4}}>{orden.descripcion}</div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        {orden.tecnico!=='—'&&<div style={{display:'flex',alignItems:'center',gap:4}}><Avatar name={orden.tecnico} size={20}/><span style={{fontSize:11,color:'var(--c-text-secondary)'}}>{orden.tecnico}</span></div>}
        {orden.tecnico==='—'&&<span style={{fontSize:11,color:'var(--c-text-muted)',fontStyle:'italic'}}>Sin asignar</span>}
      </div>
      <span style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:13,color:orden.importe!=='—'?'var(--c-text)':'var(--c-text-muted)'}}>{orden.importe}</span>
    </div>
  </div>
);

const OrdenesView=()=>{
  const [viewMode,setViewMode]=useState('kanban');
  const [search,setSearch]=useState('');
  const [statusFilter,setStatusFilter]=useState('todos');
  const [selected,setSelected]=useState(null);

  const orden=ORDENES.find(o=>o.id===selected);

  const filteredList=ORDENES.filter(o=>{
    const q=search.toLowerCase();
    const match=!q||o.id.toLowerCase().includes(q)||o.cliente.toLowerCase().includes(q)||o.matricula.toLowerCase().includes(q);
    const f=statusFilter==='todos'||o.estado===statusFilter;
    return match&&f;
  });

  return (
    <div className="page-enter" style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
        <div>
          <h1 style={{fontFamily:'var(--font-display)',fontSize:21,fontWeight:700,color:'var(--c-text)',letterSpacing:'-0.02em'}}>Órdenes de Trabajo</h1>
          <p style={{fontSize:13,color:'var(--c-text-secondary)',marginTop:2}}>{ORDENES.length} órdenes totales · {ORDENES.filter(o=>o.estado==='en_curso').length} en curso hoy</p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {/* View toggle */}
          <div style={{display:'flex',background:'var(--c-bg)',border:'1px solid var(--c-border)',borderRadius:'var(--r-md)',padding:3,gap:2}}>
            {[['kanban','grid','Kanban'],['lista','list','Lista']].map(([id,ic,lbl])=>(
              <button key={id} onClick={()=>setViewMode(id)}
                style={{display:'flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:6,border:'none',cursor:'pointer',transition:'all var(--transition)',background:viewMode===id?'var(--c-surface)':'transparent',color:viewMode===id?'var(--c-text)':'var(--c-text-muted)',fontWeight:viewMode===id?600:400,fontSize:12,boxShadow:viewMode===id?'var(--shadow-xs)':'none'}}>
                <I n={ic} s={13}/>{lbl}
              </button>
            ))}
          </div>
          <Btn icon="plus" variant="primary" onClick={()=>window.__openOrden&&window.__openOrden()}>Nueva Orden</Btn>
        </div>
      </div>

      {/* Toolbar */}
      <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        <SearchBar placeholder="Buscar OT, cliente o matrícula…" value={search} onChange={setSearch}/>
        {viewMode==='lista'&&<div style={{display:'flex',gap:6}}>
          {[['todos','Todos'],...KANBAN_COLS.map(c=>[c.id,c.label])].map(([v,l])=>(
            <Chip key={v} label={l} active={statusFilter===v} onClick={()=>setStatusFilter(v)} dot={BS[v]?.color}/>
          ))}
        </div>}
        <Btn variant="secondary" size="sm" icon="download" style={{marginLeft:'auto'}}>Exportar</Btn>
      </div>

      {/* KANBAN */}
      {viewMode==='kanban'&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,alignItems:'start'}}>
          {KANBAN_COLS.map(col=>{
            const colOrdenes=ORDENES.filter(o=>o.estado===col.id&&(!search||(o.cliente.toLowerCase().includes(search.toLowerCase())||o.matricula.toLowerCase().includes(search.toLowerCase())||o.id.toLowerCase().includes(search.toLowerCase()))));
            return (
              <div key={col.id}>
                {/* Column header */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,padding:'6px 10px',borderRadius:'var(--r-md)',background:col.bg}}>
                  <span style={{fontSize:12,fontWeight:700,color:col.color,textTransform:'uppercase',letterSpacing:'0.06em'}}>{col.label}</span>
                  <span style={{width:20,height:20,borderRadius:'50%',background:col.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:800,color:'#fff'}}>{colOrdenes.length}</span>
                </div>
                {/* Cards */}
                {colOrdenes.map(o=><KanbanCard key={o.id} orden={o} onClick={()=>setSelected(o.id)}/>)}
                {colOrdenes.length===0&&<div style={{padding:'24px 12px',textAlign:'center',border:'1.5px dashed var(--c-border)',borderRadius:'var(--r-md)',color:'var(--c-text-muted)',fontSize:12}}>Sin órdenes</div>}
              </div>
            );
          })}
        </div>
      )}

      {/* LISTA */}
      {viewMode==='lista'&&(
        <Card style={{padding:0}}>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead>
                <tr style={{borderBottom:'1px solid var(--c-border)'}}>
                  {['OT','Cliente','Matrícula','Vehículo','Estado','Técnico','Importe','Fecha',''].map(c=>(
                    <th key={c} style={{padding:'10px 16px',textAlign:'left',fontSize:11,fontWeight:700,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.07em',whiteSpace:'nowrap'}}>{c}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filteredList.map(o=>(
                  <tr key={o.id} onClick={()=>setSelected(o.id)}
                    style={{borderBottom:'1px solid var(--c-border)',cursor:'pointer',transition:'background var(--transition)'}}
                    onMouseEnter={e=>e.currentTarget.style.background='var(--c-bg)'}
                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    <td style={{padding:'12px 16px',fontFamily:'var(--font-display)',fontWeight:700,color:'var(--c-accent)',fontSize:12}}>{o.id}</td>
                    <td style={{padding:'12px 16px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}><Avatar name={o.cliente} size={26}/><span style={{fontWeight:500,color:'var(--c-text)'}}>{o.cliente}</span></div>
                    </td>
                    <td style={{padding:'12px 16px'}}><Plate value={o.matricula}/></td>
                    <td style={{padding:'12px 16px',color:'var(--c-text-secondary)',maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.vehiculo}</td>
                    <td style={{padding:'12px 16px'}}><Badge status={o.estado}/></td>
                    <td style={{padding:'12px 16px',color:'var(--c-text-secondary)'}}>{o.tecnico}</td>
                    <td style={{padding:'12px 16px',fontFamily:'var(--font-display)',fontWeight:700,color:'var(--c-text)'}}>{o.importe}</td>
                    <td style={{padding:'12px 16px',color:'var(--c-text-muted)',fontSize:12}}>{o.fecha}</td>
                    <td style={{padding:'12px 16px'}}><button style={{background:'none',border:'none',cursor:'pointer',color:'var(--c-text-muted)'}}><I n="chevronRight" s={14}/></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
            {filteredList.length===0&&<div style={{padding:'48px',textAlign:'center',color:'var(--c-text-muted)',fontSize:14}}>No se encontraron órdenes</div>}
          </div>
          <div style={{padding:'10px 18px',borderTop:'1px solid var(--c-border)',fontSize:12,color:'var(--c-text-muted)'}}>Mostrando {filteredList.length} de {ORDENES.length} órdenes</div>
        </Card>
      )}

      {/* Order detail panel */}
      <Panel open={!!selected} onClose={()=>setSelected(null)} width={400}>
        {orden&&<>
          <div style={{padding:'20px 20px 20px',background:'var(--c-primary)',flexShrink:0}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <button onClick={()=>setSelected(null)} style={{background:'rgba(255,255,255,0.12)',border:'none',borderRadius:'var(--r-md)',width:30,height:30,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'#fff'}}><I n="x" s={14}/></button>
              <Badge status={orden.estado} size="lg"/>
            </div>
            <div style={{fontFamily:'var(--font-display)',fontSize:22,fontWeight:700,color:'#fff',marginBottom:4}}>{orden.id}</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.6)',marginBottom:12,lineHeight:1.5}}>{orden.descripcion}</div>
            <div style={{display:'flex',gap:20}}>
              <div><div style={{fontSize:10,color:'rgba(255,255,255,0.4)',textTransform:'uppercase',letterSpacing:'0.07em',fontWeight:700}}>Fecha</div><div style={{fontSize:13,color:'#fff',marginTop:2}}>{orden.fecha}</div></div>
              <div><div style={{fontSize:10,color:'rgba(255,255,255,0.4)',textTransform:'uppercase',letterSpacing:'0.07em',fontWeight:700}}>Importe</div><div style={{fontSize:16,color:'#fff',marginTop:2,fontFamily:'var(--font-display)',fontWeight:700}}>{orden.importe}</div></div>
            </div>
          </div>
          <div style={{padding:20,display:'flex',flexDirection:'column',gap:16}}>
            {/* Cliente */}
            <div style={{padding:14,borderRadius:'var(--r-md)',background:'var(--c-bg)',border:'1px solid var(--c-border)'}}>
              <div style={{fontSize:11,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.07em',fontWeight:700,marginBottom:10}}>Cliente</div>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <Avatar name={orden.cliente} size={36}/>
                <div><div style={{fontWeight:600,color:'var(--c-text)'}}>{orden.cliente}</div><div style={{fontSize:12,color:'var(--c-text-muted)',marginTop:1}}>{CLIENTES.find(c=>c.id===orden.cId)?.email}</div></div>
              </div>
            </div>
            {/* Vehículo */}
            <div style={{padding:14,borderRadius:'var(--r-md)',background:'var(--c-bg)',border:'1px solid var(--c-border)'}}>
              <div style={{fontSize:11,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.07em',fontWeight:700,marginBottom:10}}>Vehículo</div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div><div style={{fontWeight:600,color:'var(--c-text)'}}>{orden.vehiculo}</div></div>
                <Plate value={orden.matricula}/>
              </div>
            </div>
            {/* Técnico */}
            <div style={{padding:14,borderRadius:'var(--r-md)',background:'var(--c-bg)',border:'1px solid var(--c-border)'}}>
              <div style={{fontSize:11,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.07em',fontWeight:700,marginBottom:10}}>Técnico asignado</div>
              {orden.tecnico!=='—'?<div style={{display:'flex',alignItems:'center',gap:8}}><Avatar name={orden.tecnico} size={28}/><span style={{fontWeight:500,color:'var(--c-text)'}}>{orden.tecnico}</span></div>:<span style={{fontSize:13,color:'var(--c-text-muted)',fontStyle:'italic'}}>Sin asignar</span>}
            </div>
            {/* Actions */}
            <div style={{display:'flex',gap:8,marginTop:4}}>
              {orden.estado==='recibido'&&<Btn variant="primary" style={{flex:1}}>Crear presupuesto</Btn>}
              {orden.estado==='presupuesto'&&<Btn variant="primary" style={{flex:1}}>Aprobar y asignar</Btn>}
              {orden.estado==='en_curso'&&<Btn variant="success" style={{flex:1}}>Marcar como lista</Btn>}
              {orden.estado==='listo'&&<Btn variant="primary" style={{flex:1}}>Confirmar entrega</Btn>}
              {orden.estado==='impagado'&&<Btn variant="danger" style={{flex:1}}>Gestionar cobro</Btn>}
              <Btn variant="secondary" icon="edit">Editar</Btn>
            </div>
          </div>
        </>}
      </Panel>
    </div>
  );
};

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
const Modal=({open,onClose,children,width=560,title,subtitle,step,totalSteps})=>{
  useEffect(()=>{
    const h=e=>{ if(e.key==='Escape') onClose(); };
    if(open) document.addEventListener('keydown',h);
    return()=>document.removeEventListener('keydown',h);
  },[open,onClose]);
  if(!open) return null;
  return (
    <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:20,background:'rgba(8,12,24,0.72)',backdropFilter:'blur(4px)',animation:'backdropIn 200ms ease'}} onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div style={{width:'100%',maxWidth:width,background:'var(--c-surface)',borderRadius:'var(--r-xl)',boxShadow:'var(--shadow-lg)',border:'1px solid var(--c-border)',display:'flex',flexDirection:'column',maxHeight:'90vh',animation:'modalIn 220ms cubic-bezier(0.34,1.2,0.64,1)'}}>
        {/* Header */}
        <div style={{padding:'22px 24px 16px',borderBottom:'1px solid var(--c-border)',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
            <div>
              <h2 style={{fontFamily:'var(--font-display)',fontSize:17,fontWeight:700,color:'var(--c-text)',letterSpacing:'-0.01em'}}>{title}</h2>
              {subtitle&&<p style={{fontSize:13,color:'var(--c-text-secondary)',marginTop:3}}>{subtitle}</p>}
            </div>
            <button onClick={onClose} style={{width:30,height:30,borderRadius:'var(--r-md)',border:'1px solid var(--c-border)',background:'var(--c-bg)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'var(--c-text-muted)',flexShrink:0,marginTop:2}}><I n="x" s={14}/></button>
          </div>
          {/* Step indicator */}
          {totalSteps&&<div style={{display:'flex',gap:6,marginTop:14}}>
            {Array.from({length:totalSteps},(_,i)=>(
              <div key={i} style={{height:3,flex:1,borderRadius:2,background:i<step?'var(--c-accent)':i===step?'var(--c-accent)':'var(--c-border)',opacity:i===step?1:i<step?0.8:1,transition:'background 0.3s'}}/>
            ))}
          </div>}
        </div>
        {/* Body */}
        <div style={{overflowY:'auto',flex:1}}>
          {children}
        </div>
      </div>
    </div>
  );
};

const ModalNuevaOrden=({open,onClose})=>{
  const [step,setStep]=useState(0);
  const [clienteSearch,setClienteSearch]=useState('');
  const [clienteSel,setClienteSel]=useState(null);
  const [vehiculoSel,setVehiculoSel]=useState(null);
  const [matriculaManual,setMatriculaManual]=useState('');
  const [descripcion,setDescripcion]=useState('');
  const [tecnico,setTecnico]=useState('sin_asignar');
  const [prioridad,setPrioridad]=useState('normal');
  const [done,setDone]=useState(false);
  const [loading,setLoading]=useState(false);

  const reset=()=>{ setStep(0);setClienteSearch('');setClienteSel(null);setVehiculoSel(null);setMatriculaManual('');setDescripcion('');setTecnico('sin_asignar');setPrioridad('normal');setDone(false);setLoading(false); };
  const handleClose=()=>{ onClose(); setTimeout(reset,300); };

  const clientesFilt=CLIENTES.filter(c=>!clienteSearch||c.nombre.toLowerCase().includes(clienteSearch.toLowerCase())||c.tel.includes(clienteSearch));
  const vehiculosCliente=VEHICULOS.filter(v=>v.propId===clienteSel?.id);

    setLoading(true);

  };

  return (
    <Modal open={open} onClose={handleClose} width={540}

      {done ? (
        /* ── SUCCESS ── */
        <div style={{padding:'40px 24px',textAlign:'center'}}>
          <div style={{width:64,height:64,borderRadius:'50%',background:'var(--c-green-soft)',border:'2px solid var(--c-green)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',color:'var(--c-green)'}}><I n="check" s={28} w={2.5}/></div>

                <button key={v.id} onClick={()=>setVehiculoSel(v)}
                  style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',borderRadius:'var(--r-md)',border:`1.5px solid ${vehiculoSel?.id===v.id?'var(--c-accent)':'var(--c-border)'}`,background:vehiculoSel?.id===v.id?'var(--c-accent-soft)':'var(--c-surface)',cursor:'pointer',transition:'all var(--transition)',textAlign:'left'}}
                  onMouseEnter={e=>{ if(vehiculoSel?.id!==v.id) e.currentTarget.style.background='var(--c-bg)'; }}
                  onMouseLeave={e=>{ if(vehiculoSel?.id!==v.id) e.currentTarget.style.background='var(--c-surface)'; }}>
                  <span style={{width:38,height:38,borderRadius:'var(--r-md)',background:'var(--c-bg)',border:'1px solid var(--c-border)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--c-text-muted)'}}><I n="car" s={17}/></span>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <Plate value={v.matricula}/>
                      <span style={{fontWeight:600,color:'var(--c-text)',fontSize:13}}>{v.marca} {v.modelo}</span>
                    </div>
                    <div style={{fontSize:11,color:'var(--c-text-muted)',marginTop:3}}>{v.anio} · {v.km} km · ITV: {v.itv}</div>
                  </div>
                  {vehiculoSel?.id===v.id&&<I n="check" s={16} c="var(--c-accent)"/>}
                </button>
              ))}
            </div>
          </>}
          <div style={{fontSize:12,fontWeight:700,color:'var(--c-text-muted)',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:8}}>Introducir matrícula manualmente</div>
          <FInput placeholder="Ej: 1234-XYZ" value={matriculaManual} onChange={v=>{ setMatriculaManual(v.toUpperCase());setVehiculoSel(null); }} icon="car"/>
        </div>
      ) : (
        /* ── STEP 3: DETALLES ── */
        <div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:16}}>
          {/* Summary chips */}
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:'var(--r-full)',background:'var(--c-accent-soft)',color:'var(--c-accent)',fontSize:12,fontWeight:600}}><I n="clients" s={12}/>{cliente?.nombre}</span>
            <span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:'var(--r-full)',background:'var(--c-bg)',color:'var(--c-text-secondary)',fontSize:12,fontWeight:600,border:'1px solid var(--c-border)'}}><I n="car" s={12}/>{vehiculoSel?.matricula||matriculaManual||'—'}</span>
          </div>
          <FormField label="Descripción del trabajo" required>
            <FTextarea placeholder="Describe la avería o el servicio solicitado…" value={descripcion} onChange={setDescripcion} rows={3}/>
          </FormField>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            <FormField label="Técnico asignado">
              <FSelect value={tecnico} onChange={setTecnico} options={[['sin_asignar','Sin asignar'],['rafa','Rafa'],['luis','Luis'],['miguel','Miguel']]}/>
            </FormField>
            <FormField label="Prioridad">
              <div style={{display:'flex',gap:6}}>
                {[['normal','Normal'],['urgente','Urgente'],['express','Express']].map(([v,l])=>(
                  <button key={v} onClick={()=>setPrioridad(v)}
                    style={{flex:1,padding:'8px 4px',borderRadius:'var(--r-md)',border:`1.5px solid ${prioridad===v?v==='urgente'?'var(--c-yellow)':v==='express'?'var(--c-red)':'var(--c-accent)':'var(--c-border)'}`,background:prioridad===v?v==='urgente'?'var(--c-yellow-soft)':v==='express'?'var(--c-red-soft)':'var(--c-accent-soft)':'var(--c-bg)',color:prioridad===v?v==='urgente'?'var(--c-yellow-text)':v==='express'?'var(--c-red)':'var(--c-accent)':'var(--c-text-muted)',fontSize:11,fontWeight:700,cursor:'pointer',transition:'all var(--transition)'}}>
                    {l}
                  </button>
                ))}
              </div>
            </FormField>
          </div>
          <FormField label="Observaciones" hint="Opcional — notas internas del taller">
            <FInput placeholder="Ej: cliente trae el coche mañana a las 9h" value="" onChange={()=>{}}/>
          </FormField>
        </div>
      )}

      {!done&&<ModalFooter
        onBack={step>0?()=>setStep(s=>s-1):undefined}
        onNext={step<2?()=>setStep(s=>s+1):undefined}
        onSubmit={handleSubmit}
        canNext={step===0?!!clienteSel:step===1?(!!vehiculoSel||matriculaManual.length>=4):descripcion.trim().length>3}
        isLast={step===2}
        loading={loading}
        submitLabel="Crear orden"
      />}
    </Modal>
  );
};

/* ── MODAL NUEVO CLIENTE ──────────────────────────────── */
const ModalNuevoCliente=({open,onClose})=>{
  const [nombre,setNombre]=useState('');
  const [tel,setTel]=useState('');
  const [email,setEmail]=useState('');
  const [dni,setDni]=useState('');
  const [notas,setNotas]=useState('');
  const [errors,setErrors]=useState({});
  const [done,setDone]=useState(false);
  const [loading,setLoading]=useState(false);

  const reset=()=>{ setNombre('');setTel('');setEmail('');setDni('');setNotas('');setErrors({});setDone(false);setLoading(false); };
  const handleClose=()=>{ onClose(); setTimeout(reset,300); };

  const validate=()=>{
    const e={};
    if(!nombre.trim()) e.nombre='El nombre es obligatorio';
    if(!tel.trim()) e.tel='El teléfono es obligatorio';
    else if(!/^[0-9\s\+\-]{9,}$/.test(tel.trim())) e.tel='Introduce un teléfono válido';
    if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email='Email no válido';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const handleSubmit=()=>{
    if(!validate()) return;
    setLoading(true);
    setTimeout(()=>{ setLoading(false); setDone(true); },1000);
  };

  if(!open) return null;
  return (
    <Modal open={open} onClose={handleClose} width={480} title={done?'Cliente registrado':'Nuevo cliente'} subtitle={done?undefined:'Rellena los datos del nuevo cliente'}>
      {done ? (
        <div style={{padding:'40px 24px',textAlign:'center'}}>
          <Avatar name={nombre} size={64}/>
          <div style={{fontFamily:'var(--font-display)',fontSize:18,fontWeight:700,color:'var(--c-text)',marginTop:14,marginBottom:4}}>{nombre}</div>
          <div style={{fontSize:13,color:'var(--c-text-secondary)',marginBottom:24}}>{tel}{email&&` · ${email}`}</div>
          <div style={{display:'flex',gap:10,justifyContent:'center'}}>
            <Btn variant="secondary" onClick={reset} icon="plus">Otro cliente</Btn>
            <Btn variant="success" onClick={handleClose} icon="car">Añadir vehículo</Btn>
            <Btn variant="primary" onClick={handleClose} icon="eye">Ver cliente</Btn>
          </div>
        </div>
      ) : (
        <>
          <div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:14}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
              <FormField label="Nombre completo" required error={errors.nombre}>
                <FInput placeholder="Pedro García" value={nombre} onChange={setNombre} error={errors.nombre} autoFocus/>
              </FormField>
              <FormField label="Teléfono" required error={errors.tel}>
                <FInput placeholder="612 345 678" value={tel} onChange={setTel} icon="phone" error={errors.tel} type="tel"/>
              </FormField>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
              <FormField label="Email" error={errors.email}>
                <FInput placeholder="pedro@email.com" value={email} onChange={setEmail} icon="mail" type="email" error={errors.email}/>
              </FormField>
              <FormField label="DNI / NIF" hint="Opcional">
                <FInput placeholder="12345678A" value={dni} onChange={setDni}/>
              </FormField>
            </div>
            <FormField label="Notas internas" hint="Observaciones del cliente, preferencias, historial…">
              <FTextarea placeholder="Cliente habitual, prefiere avisar por WhatsApp…" value={notas} onChange={setNotas} rows={2}/>
            </FormField>
          </div>
          <ModalFooter onSubmit={handleSubmit} isLast canNext={nombre.trim().length>1&&tel.trim().length>8} loading={loading} submitLabel="Registrar cliente"/>
        </>
      )}
    </Modal>
  );
};

/* ═══════════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "darkMode": false,
  "accentColor": "cobalt",
  "sidebarCollapsed": true
}/*EDITMODE-END*/;

const accentMap={
  orange:{a:'oklch(0.64 0.18 40)',h:'oklch(0.58 0.20 40)',s:'oklch(0.96 0.04 40)'},
  emerald:{a:'oklch(0.65 0.18 150)',h:'oklch(0.58 0.18 150)',s:'oklch(0.96 0.05 150)'},
  cobalt:{a:'oklch(0.60 0.18 245)',h:'oklch(0.54 0.20 245)',s:'oklch(0.95 0.04 245)'},
};

const GenericView=({name})=>(
  <div className="page-enter">
    <PageHeader title={name} actionLabel="Nuevo"/>
    <Card style={{minHeight:300,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{textAlign:'center'}}>
        <div style={{width:44,height:44,borderRadius:'var(--r-lg)',background:'var(--c-bg)',border:'1px solid var(--c-border)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',color:'var(--c-text-muted)'}}><I n="tool" s={18}/></div>
        <p style={{color:'var(--c-text-muted)',fontSize:14}}>Vista de {name} — próximamente</p>
      </div>
    </Card>
  </div>
);

const App=()=>{
  const [nav,setNav]=useState(()=>localStorage.getItem('t360_nav')||'dashboard');
  const [collapsed,setCollapsed]=useState(TWEAK_DEFAULTS.sidebarCollapsed);
  const [darkMode,setDarkMode]=useState(TWEAK_DEFAULTS.darkMode);
  const [tweaks,setTweaks]=useState(TWEAK_DEFAULTS);
  const [showTweaks,setShowTweaks]=useState(false);
  const [modalOrden,setModalOrden]=useState(false);
  const [modalCliente,setModalCliente]=useState(false);

  // Global openers for child views
  useEffect(()=>{ window.__openOrden=()=>setModalOrden(true); window.__openCliente=()=>setModalCliente(true); },[]);

  useEffect(()=>{ localStorage.setItem('t360_nav',nav); },[nav]);
  useEffect(()=>{ document.documentElement.classList.toggle('dark',darkMode); },[darkMode]);
  useEffect(()=>{
    const acc=accentMap[tweaks.accentColor]||accentMap.cobalt;
    document.documentElement.style.setProperty('--c-accent',acc.a);
    document.documentElement.style.setProperty('--c-accent-hover',acc.h);
    document.documentElement.style.setProperty('--c-accent-soft',acc.s);
    document.documentElement.style.setProperty('--c-blue',acc.a);
    document.documentElement.style.setProperty('--c-blue-soft',acc.s);
  },[tweaks.accentColor]);
  useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode') setShowTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);

  const updateTweak=(key,val)=>{
    const next={...tweaks,[key]:val};
    setTweaks(next);
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:{[key]:val}},'*');
    if(key==='darkMode') setDarkMode(val);
    if(key==='sidebarCollapsed') setCollapsed(val);
  };

  const sidebarW=collapsed?'var(--sidebar-collapsed-w)':'var(--sidebar-w)';
  const views={dashboard:<DashboardView/>,clientes:<ClientesView/>,vehiculos:<VehiculosView/>,ordenes:<OrdenesView/>,facturacion:<GenericView name="Facturación"/>,config:<GenericView name="Configuración"/>};

  return (
    <div style={{minHeight:'100vh',background:'var(--c-bg)'}}>
      <Sidebar active={nav} onNav={setNav} collapsed={collapsed} onToggle={()=>{const n=!collapsed;setCollapsed(n);updateTweak('sidebarCollapsed',n);}}/>
      <Topbar sidebarW={sidebarW} darkMode={darkMode} onToggleDark={()=>setDarkMode(!darkMode)}/>
      <main style={{marginLeft:sidebarW,paddingTop:'var(--topbar-h)',transition:'margin-left var(--transition)'}}>
        <div style={{padding:'24px 24px 48px'}}>
          {views[nav]||<DashboardView/>}
        </div>
      </main>

      <ModalNuevaOrden open={modalOrden} onClose={()=>setModalOrden(false)}/>
      <ModalNuevoCliente open={modalCliente} onClose={()=>setModalCliente(false)}/>
      {/* Tweaks */}
      {showTweaks&&<div style={{position:'fixed',bottom:20,right:20,zIndex:9999,background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:'var(--r-xl)',boxShadow:'var(--shadow-lg)',padding:18,width:252,fontFamily:'var(--font-body)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <span style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:13,color:'var(--c-text)'}}>Tweaks</span>
          <button onClick={()=>setShowTweaks(false)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--c-text-muted)'}}><I n="x" s={13}/></button>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--c-text-muted)',letterSpacing:'0.07em',textTransform:'uppercase',marginBottom:7}}>Modo</div>
            <div style={{display:'flex',gap:6}}>
              {[['false','Claro'],['true','Oscuro']].map(([v,l])=>(
                <button key={v} onClick={()=>updateTweak('darkMode',v==='true')} style={{flex:1,padding:'6px',borderRadius:'var(--r-md)',border:`1.5px solid ${String(darkMode)===v?'var(--c-accent)':'var(--c-border)'}`,background:String(darkMode)===v?'var(--c-accent-soft)':'var(--c-bg)',color:'var(--c-text)',fontSize:12,fontWeight:600,cursor:'pointer'}}>{l}</button>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--c-text-muted)',letterSpacing:'0.07em',textTransform:'uppercase',marginBottom:7}}>Acento</div>
            <div style={{display:'flex',gap:6}}>
              {[['orange','Naranja','oklch(0.64 0.18 40)'],['emerald','Verde','oklch(0.65 0.18 150)'],['cobalt','Azul','oklch(0.60 0.18 245)']].map(([v,l,clr])=>(
                <button key={v} onClick={()=>updateTweak('accentColor',v)} style={{flex:1,padding:'6px 4px',borderRadius:'var(--r-md)',border:`1.5px solid ${tweaks.accentColor===v?clr:'var(--c-border)'}`,background:'var(--c-bg)',fontSize:11,fontWeight:600,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,color:'var(--c-text)'}}>
                  <span style={{width:14,height:14,borderRadius:'50%',background:clr}}/>{l}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--c-text-muted)',letterSpacing:'0.07em',textTransform:'uppercase',marginBottom:7}}>Sidebar</div>
            <div style={{display:'flex',gap:6}}>
              {[['Expandido',false],['Colapsado',true]].map(([l,v])=>(
                <button key={l} onClick={()=>{setCollapsed(v);updateTweak('sidebarCollapsed',v);}} style={{flex:1,padding:'6px',borderRadius:'var(--r-md)',border:`1.5px solid ${collapsed===v?'var(--c-accent)':'var(--c-border)'}`,background:collapsed===v?'var(--c-accent-soft)':'var(--c-bg)',color:'var(--c-text)',fontSize:12,fontWeight:600,cursor:'pointer'}}>{l}</button>
              ))}
            </div>
          </div>
        </div>
      </div>}
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
